<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Agent 轨迹</title>
<style>
  body { font: 14px/1.6 system-ui, sans-serif; max-width: 860px; margin: 24px auto; padding: 0 16px; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  form { display: flex; gap: 8px; margin-bottom: 16px; }
  input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font: inherit; }
  #sid { flex: 0 0 110px; }
  button { padding: 8px 14px; border: 1px solid #ccc; border-radius: 4px; background: #f6f6f6; cursor: pointer; font: inherit; }
  button:disabled { opacity: .5; cursor: default; }
  .step { border-left: 3px solid #ddd; padding: 6px 0 6px 12px; margin-bottom: 10px; }
  .step.answer { border-color: #2a7; }
  .step.错误 { border-color: #c33; }
  .head { color: #666; font-size: 12px; }
  .node { font-weight: 600; color: #222; }
  pre { margin: 4px 0 0; white-space: pre-wrap; font: inherit; }
  #tip { color: #888; font-size: 12px; }
</style>
</head>
<body>
<h1>MedicalAgent 轨迹</h1>
<form id="f">
  <input id="sid" value="web" title="session_id">
  <input id="msg" value="我这两天肚子痛，还拉肚子" autocomplete="off">
  <button id="send">发送</button>
  <button id="reset" type="button">重置会话</button>
</form>
<div id="tip">一轮要 1~3 分钟，节点会逐个出现。追问时直接回答后继续发送。</div>
<div id="out"></div>

<script>
const out = document.getElementById('out');
const sendBtn = document.getElementById('send');

function step(e) {
  const div = document.createElement('div');
  div.className = 'step ' + e.node;
  const head = document.createElement('div');
  head.className = 'head';
  head.innerHTML = `<span class="node">${e.node}</span> · ${e.elapsed}s`;
  const pre = document.createElement('pre');
  pre.textContent = e.lines.join('\n');
  div.append(head, pre);
  out.append(div);
  div.scrollIntoView({ block: 'nearest' });
}

document.getElementById('f').onsubmit = async (ev) => {
  ev.preventDefault();
  const body = JSON.stringify({
    session_id: document.getElementById('sid').value,
    message: document.getElementById('msg').value,
  });
  out.insertAdjacentHTML('beforeend',
    `<div class="step"><div class="head">你说</div><pre>${document.getElementById('msg').value}</pre></div>`);
  sendBtn.disabled = true;
  sendBtn.textContent = '运行中…';

  const res = await fetch('/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body });
  const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
  let buf = '';
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += value;
    const parts = buf.split('\n\n');
    buf = parts.pop();
    for (const p of parts) {
      if (!p.startsWith('data: ')) continue;
      const e = JSON.parse(p.slice(6));
      if (e.done) { out.insertAdjacentHTML('beforeend', `<div id="tip">本轮结束，共 ${e.elapsed}s</div>`); }
      else step(e);
    }
  }
  sendBtn.disabled = false;
  sendBtn.textContent = '发送';
  document.getElementById('msg').select();
};

document.getElementById('reset').onclick = async () => {
  await fetch('/reset', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ session_id: document.getElementById('sid').value, message: '' }),
  });
  out.innerHTML = '';
};
</script>
</body>
</html>
