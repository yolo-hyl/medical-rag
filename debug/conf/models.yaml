# 联调用：本地 vLLM 服务（OpenAI 兼容）
# text_sparse 用 Milvus 托管 BM25，省掉构建词表（vocab.pkl.gz）这一步
embedding:
  summary_dense:
    model: Octen-Embedding-8B
    base_url: http://10.88.88.6:8000/v1
    api_key_env: VLLM_API_KEY
    dimension: 4096
    send_dimensions: false   # 不支持 Matryoshka，请求里带 dimensions 会 400
    max_batch: 64
  text_dense:
    model: Octen-Embedding-8B
    base_url: http://10.88.88.6:8000/v1
    api_key_env: VLLM_API_KEY
    dimension: 4096
    send_dimensions: false
    max_batch: 64
  text_sparse:
    provider: Milvus
    k1: 1.5
    b: 0.75

llm:
  model: Qwen3.8-27B
  base_url: http://10.88.88.6:8001/v1
  api_key_env: VLLM_API_KEY
  temperature: 0.1
