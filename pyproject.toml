[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medrag"
version = "2.0.0.dev0"
description = "专攻医疗领域的通用 RAG 库"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"   # FalkorDBLite 要求 3.12（D19）
authors = [{ name = "hy", email = "zjl4376@gmail.com" }]
keywords = ["RAG", "Medical", "LLM"]
# 核心依赖只包含模型层、配置与提示词；存储、应用、评测按需通过 extras 安装
dependencies = [
    "openai>=1.99",
    "httpx>=0.27",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# 每组都带着未配置服务地址时的降级实现（D18）：Milvus Lite / fakeredis / SQLite（标准库）/ FalkorDBLite
# 实测组合：pymilvus 2.6 + milvus-lite 3.x 全部可用；pymilvus 2.5 + milvus-lite 3.x 混合检索报 function_score；
# milvus-lite 2.5 不支持 HNSW。milvus-lite 没有 Windows 版本
milvus = ["pymilvus>=2.6,<2.7", "milvus-lite>=3.0; sys_platform != 'win32'"]
redis = ["redis>=5.0", "fakeredis[lua]>=2.20"]   # 会话锁用到 Lua 脚本，fakeredis 需要 lua 依赖（lupa）
pg = ["psycopg[binary]>=3.1"]
graph = ["neo4j>=5.20,<6", "falkordblite>=0.10"]
# 自管理词表的中文 BM25（pkuseg 需要先装 numpy / cython，并用 --no-build-isolation 安装）
zh = ["pkuseg>=0.0.25", "stopwords-zh==2023.6.5.13.18.38"]  # 不要同时装 stopwords 包：两者写同一个目录，后装的会覆盖
agent = [
    "langchain>=0.3.27,<0.4",
    "langchain-core>=0.3.74,<0.4",
    "langchain-openai>=0.3.29,<0.4",
    "langgraph>=0.6.6,<0.7",
    "tiktoken>=0.7",
]
websearch = ["tencentcloud-sdk-python-wsa>=3.0"]
eval = ["datasets>=4.0", "pandas>=2.0", "ragas==0.3.2", "langchain-openai>=0.3.29,<0.4"]
dev = ["pytest>=8.0"]
all = ["medrag[milvus,redis,pg,graph,agent,eval,dev]"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["medrag*"]

[tool.setuptools.package-data]
medrag = [
    "config/*.yaml",
    "prompts/prompts.lock",
    "prompts/templates/*/*.yaml",
    "retrieval/sparse/stopword_lists/*.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "services: 需要 deploy/start.sh 启动的 Milvus / Redis 等基础服务",
]
