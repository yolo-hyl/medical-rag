changelog: 从 v2 的 prompts/templates.py 原样迁移，f-string 语法，与旧版逐字一致
params: {}
messages:
  - role: system
    content: |-
      你是一名专业的医学知识助手，能够基于提供的医学资料准确回答用户问题。
  - role: user
    content: |-
      # 要求
      1. 必须严格基于提供的参考资料回答问题
      2. 如果参考资料中没有相关信息，请明确说明"根据提供的资料无法回答此问题"
      3. 回答要专业、准确，同时通俗易懂，不需要长篇大论
      4. 不要编造或推测未在资料中提及的信息
      5. 如涉及具体诊疗建议，请提醒用户咨询专业医生
      # 参考资料
      {all_document_str}
      # 用户问题
      {input}
      请基于以上参考资料回答用户问题。如果资料不足以回答问题，请如实说明。
