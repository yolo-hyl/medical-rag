# 连接 deploy/start.sh 启动的服务（地址、端口与 deploy/.env.example 一致）
# 用法：export MEDRAG_CONFIG_OVERRIDES=deploy/storage.yaml
#      或 ConfigLoader(overrides=["deploy/storage.yaml"])
# 覆盖是按顶层 key 整段替换的，所以这里每一段都写全。密码从环境变量读取（ConfigLoader 会自动加载 deploy/.env）。
milvus:
  uri: http://localhost:19530
  token: null
  collection_name: medical_knowledge
  drop_old: true
  auto_id: false

postgres:
  host: 127.0.0.1
  port: 5432
  user: medrag
  database: medrag
  password_env: POSTGRES_PASSWORD

redis:
  host: 127.0.0.1
  port: 6379
  db: 0
  password_env: REDIS_PASSWORD
  session_ttl: 604800
  lock_timeout: 600
  lock_wait: 600

neo4j:
  uri: bolt://127.0.0.1:7687
  user: neo4j
  password_env: NEO4J_PASSWORD
